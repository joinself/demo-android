name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: joinself/actions/dispatch-and-wait@main
        with:
          repo: joinself/demo-android-gha
          workflow: ci.yml
          workflow-inputs: '{"git-ref":"${{ github.head_ref || github.ref_name }}"}'
          token: ${{ secrets.GH_PAT_DEMO_ANDROID_GHA }}
